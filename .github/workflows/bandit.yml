name: Security check - Bandit

on: push

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write
      # only required for workflows in private repositories
      actions: read
      contents: read
    steps:
      - name: Perform Bandit Analysis
        # v1 (1.0.1) hardcodes Python 3.8, not available on ubuntu-latest anymore:
        # pin a main commit, the only one with the python-version input
        uses: PyCQA/bandit-action@044eb14cd9d9e339d23c8f6511f217824a10a256
        with:
            targets: ./src
            python-version: "3.12"
